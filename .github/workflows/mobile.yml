name: Mobile CI and releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: ./android/tools/setup-android-sdk.sh
      - name: Test, lint, and build Android
        run: ./android/tools/check.sh fast
      - name: Prepare Android APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p release-assets
          if [[ "$GITHUB_REF_TYPE" == tag && -n "$KEYSTORE_BASE64" && -n "$ANDROID_SIGNING_STORE_PASSWORD" && -n "$ANDROID_SIGNING_KEY_ALIAS" && -n "$ANDROID_SIGNING_KEY_PASSWORD" ]]; then
            umask 077
            export ANDROID_SIGNING_STORE_FILE="$RUNNER_TEMP/woona-release.keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_SIGNING_STORE_FILE"
            (cd android && ./gradlew assembleRelease --no-daemon --console=plain)
            "$ANDROID_SDK_ROOT/build-tools/36.1.0/apksigner" verify android/app/build/outputs/apk/release/app-release.apk
            cp android/app/build/outputs/apk/release/app-release.apk release-assets/Woona-Android-release.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/Woona-Android-debug.apk
          fi
          (cd release-assets && sha256sum *.apk > SHA256SUMS-android.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Test iOS on simulator
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')"
          xcodebuild -project ios/Woona.xcodeproj -scheme Woona -derivedDataPath "$RUNNER_TEMP/WoonaDerived" -destination "platform=iOS Simulator,id=$simulator_id" CODE_SIGNING_ALLOWED=NO test
      - name: Package simulator app for tagged builds
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release-assets
          ditto -c -k --keepParent "$RUNNER_TEMP/WoonaDerived/Build/Products/Debug-iphonesimulator/Woona.app" release-assets/Woona-iOS-simulator.zip
          (cd release-assets && shasum -a 256 Woona-iOS-simulator.zip > SHA256SUMS-ios.txt)
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ios-simulator-app
          path: release-assets/
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shared
    env:
      WOONA_API_PORT: '18080'
      WOONA_STORAGE_ROOT_HOST: ../test-run/ci-storage
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and backup
        run: |
          docker compose config -q
          bash server/tests/test_backup.sh
      - name: Test server and API
        run: |
          mkdir -p ../test-run/ci-storage
          chmod 777 ../test-run/ci-storage
          docker compose -p woona-ci up -d --build --wait
          docker compose -p woona-ci exec -T api python -m unittest -v server.tests.test_schemas server.tests.test_api
      - name: Clean up
        if: always()
        run: docker compose -p woona-ci down -v --remove-orphans

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets/
      - uses: actions/download-artifact@v4
        with:
          name: ios-simulator-app
          path: release-assets/
      - name: Publish tested builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Woona $GITHUB_REF_NAME"
          fi
