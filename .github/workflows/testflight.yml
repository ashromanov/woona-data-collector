name: Upload iOS to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Test on iOS Simulator
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')"
          xcodebuild -project ios/Woona.xcodeproj -scheme Woona -derivedDataPath "$RUNNER_TEMP/WoonaDerived" -destination "platform=iOS Simulator,id=$simulator_id" CODE_SIGNING_ALLOWED=NO test
      - name: Archive and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${ASC_KEY_ID:?Missing ASC_KEY_ID secret}"
          : "${ASC_ISSUER_ID:?Missing ASC_ISSUER_ID secret}"
          : "${ASC_PRIVATE_KEY:?Missing ASC_PRIVATE_KEY secret}"
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key_path"
          trap 'rm -f "$key_path"' EXIT
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>NBM28T989D</string>
          </dict></plist>
          PLIST
          xcodebuild -project ios/Woona.xcodeproj -scheme Woona -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Woona.xcarchive" -allowProvisioningUpdates -authenticationKeyPath "$key_path" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Woona.xcarchive" -exportPath "$RUNNER_TEMP/WoonaExport" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates -authenticationKeyPath "$key_path" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
