[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "woona-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "fastapi==0.116.1",
  "jsonschema==4.25.0",
  "psycopg[binary]==3.2.9",
  "sqlalchemy==2.0.42",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[tool.setuptools]
packages = ["server"]
package-dir = {server = "."}
